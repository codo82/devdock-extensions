<div class="empty-state" data-role="empty"><div class="icon">🍃</div><p data-i18n="main.empty"></p></div>
<div class="mg-workspace" data-role="workspace" hidden>
  <div class="mg-conn-header" data-role="conn-header"></div>
  <div class="mg-toolbar">
    <select class="form-input mg-select" data-role="database" data-i18n-title="toolbar.databaseTitle"></select>
    <select class="form-input mg-select mg-limit" data-role="limit" data-i18n-title="toolbar.limitTitle"></select>
    <button class="btn btn-primary btn-sm" data-action="run" data-i18n="toolbar.run" data-i18n-title="toolbar.runTitle"></button>
    <button class="btn btn-ghost btn-sm" data-action="export-shell" data-i18n="toolbar.export" data-i18n-title="toolbar.exportTitle"></button>
    <button class="btn btn-ghost btn-sm" data-action="new-collection" data-role="new-collection" data-i18n="toolbar.newCollection" data-i18n-title="toolbar.newCollectionTitle"></button>
    <button class="btn btn-ghost btn-sm" data-action="history" data-i18n="toolbar.history" data-i18n-title="toolbar.historyTitle"></button>
    <span class="mg-hint" data-i18n="toolbar.hint"></span>
  </div>
  <div class="mg-editor" data-role="editor">
    <pre class="mg-editor-highlight" aria-hidden="true"><code data-role="highlight"></code></pre>
    <textarea class="mg-editor-input" data-role="code" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="db.users.find({ status: &quot;active&quot; }).sort({ _id: -1 })"></textarea>
  </div>
  <div class="mg-results" data-role="results"></div>
</div>
