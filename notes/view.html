<div class="empty-state" data-role="locked" hidden>
  <div class="icon">🔒</div>
  <p data-i18n="locked.text"></p>
  <button class="btn btn-primary" data-action="unlock" data-i18n="locked.unlock"></button>
</div>
<div class="nt-board" data-role="board" hidden>
  <div class="nt-head">
    <h2 class="nt-title" data-role="title"></h2>
    <span class="nt-muted" data-role="summary"></span>
    <div class="nt-head-actions">
      <button class="btn btn-ghost btn-sm" data-action="add-list" data-i18n="lists.add"></button>
      <button class="btn btn-ghost btn-sm" data-action="add-note" data-i18n="notes.add"></button>
    </div>
  </div>
  <h3 class="nt-h3" data-i18n="lists.title"></h3>
  <div class="nt-lists" data-role="lists"></div>
  <h3 class="nt-h3" data-i18n="notes.title"></h3>
  <div class="nt-notes" data-role="notes"></div>
</div>
